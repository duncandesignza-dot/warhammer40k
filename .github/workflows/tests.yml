# Runs the browser tests (tests/) on every pull request and every push to main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install the test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the tests
        run: npx playwright test

      - name: Keep the report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            tests/playwright-report
            tests/test-results
          retention-days: 14
